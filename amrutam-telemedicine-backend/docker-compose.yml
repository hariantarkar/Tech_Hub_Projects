# Start everything:   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amrutam
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amrutam"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env            # run "npm run setup:env" first
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/amrutam
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # For this assignment the migration runs before start. In real production use a separate migration job.
    command: ["sh", "-c", "node src/db/migrate.js && node src/server.js"]

volumes:
  db_data:
